apiVersion: apps/v1
kind: Deployment
metadata: { name: sre-agent, namespace: ai-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: sre-agent } }
  template:
    metadata: { labels: { app: sre-agent } }
    spec:
      serviceAccountName: sre-agent
      containers:
      - name: agent
        image: ghcr.io/YOUR_USER/ai-sre-agent:REPLACE_WITH_SHA
        ports: [{ containerPort: 8000 }]
        env:
        - { name: ALLOWED_NAMESPACES, value: "default,apps" }
        - { name: SES_SENDER, value: "alerts@yourdomain.com" }
        - { name: AWS_REGION, value: "ap-south-1" }
        - name: ANTHROPIC_API_KEY
          valueFrom: { secretKeyRef: { name: agent-secrets, key: anthropic_api_key } }
        - name: AGENT_API_KEY
          valueFrom: { secretKeyRef: { name: agent-secrets, key: agent_api_key } }
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
        readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: sre-agent, namespace: ai-agent }
spec:
  selector: { app: sre-agent }
  ports: [{ port: 80, targetPort: 8000 }]
