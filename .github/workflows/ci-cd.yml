name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "gitops/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "infra-terraform/**"

permissions:
  id-token: write
  contents: write   # required to update gitops manifests on image build

env:
  AWS_REGION: ap-south-1

jobs:
  ###########################################################################
  # Job 1 – Lint & Test Services
  ###########################################################################
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, product-service, sre-agent]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Syntax & Flake8 Check
        run: |
          cd services/${{ matrix.service }}
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  ###########################################################################
  # Job 2 – Build & Push Microservices & SRE Agent to AWS ECR
  ###########################################################################
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: order-service
            repo_name: order-service
          - service: product-service
            repo_name: product-service
          - service: sre-agent
            repo_name: ai-sre-agent

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute Image Tag & URI
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          URI="${REGISTRY}/${{ matrix.repo_name }}:${TAG}"
          LATEST_URI="${REGISTRY}/${{ matrix.repo_name }}:latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            --label "git.sha=${{ github.sha }}" \
            --label "service=${{ matrix.service }}" \
            -t ${{ steps.meta.outputs.uri }} \
            -t ${{ steps.meta.outputs.latest_uri }} \
            services/${{ matrix.service }}

      - name: Push to Amazon ECR
        run: |
          docker push ${{ steps.meta.outputs.uri }}
          docker push ${{ steps.meta.outputs.latest_uri }}

  ###########################################################################
  # Job 3 – Update GitOps Manifests (ArgoCD Sync Trigger)
  ###########################################################################
  gitops-update:
    name: Update GitOps Manifests (ArgoCD)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Login to Amazon ECR to get Registry URI
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Patch Image Tags in GitOps Manifests
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"

          # Update order-service
          sed -i.bak "s|image:.*|image: ${REGISTRY}/order-service:${TAG}|g" gitops/apps/order-service/deployment.yaml || true
          rm -f gitops/apps/order-service/deployment.yaml.bak

          # Update product-service
          sed -i.bak "s|image:.*|image: ${REGISTRY}/product-service:${TAG}|g" gitops/apps/product-service/deployment.yaml || true
          rm -f gitops/apps/product-service/deployment.yaml.bak

          # Update sre-agent
          sed -i.bak "s|image:.*|image: ${REGISTRY}/ai-sre-agent:${TAG}|g" gitops/apps/sre-agent/deployment.yaml || true
          rm -f gitops/apps/sre-agent/deployment.yaml.bak

      - name: Commit & Push GitOps Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "ci(gitops): update image tags to sha-${SHORT_SHA} [skip ci]"
            git push origin main
            echo "GitOps repository updated. ArgoCD will automatically detect and reconcile state."
          fi

  ###########################################################################
  # Job 4 – Terraform Validate & Plan (Pull Request Check)
  ###########################################################################
  terraform-check:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra-terraform/environments/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init (Local Backend for Validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
