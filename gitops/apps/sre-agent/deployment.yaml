apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: ai-agent
  labels:
    app: sre-agent
    app.kubernetes.io/name: sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent
      containers:
      - name: agent
        image: 729848555197.dkr.ecr.ap-south-1.amazonaws.com/ai-sre-agent/ai-sre-agent:latest
        imagePullPolicy: IfNotPresent
        command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ALLOWED_NAMESPACES
          value: "default,apps,ai-agent,argocd,kube-system"
        - name: SES_SENDER
          value: "alerts@example.com"
        - name: AWS_REGION
          value: "ap-south-1"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: anthropic_api_key
              optional: true
        - name: AGENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: agent_api_key
              optional: true
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: smtp_host
              optional: true
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: smtp_user
              optional: true
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: smtp_pass
              optional: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15

